<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catalogue - Rathkeale College Song Portal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="auth-widget.css" />
</head>
<body>
  <div class="container">
 <nav class="main-nav">
  <button type="button" class="nav-hamburger" id="nav-hamburger" aria-label="Toggle menu" aria-expanded="false">
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
  </button>
  <div class="nav-links-wrapper" id="nav-links-wrapper">
    <a href="index.html" class="nav-link">Home</a>
    <a href="songs.html" class="nav-link">Catalogue</a>
    <a href="player.html" class="nav-link">Player</a>
    <a href="about.html" class="nav-link">About</a>
    <a href="contact.html" class="nav-link">Contact</a>
  </div>
  <div id="auth-widget"></div>
</nav>

    <header class="app-branding-container">
     <div class="brand-identity-block brand-identity-with-mark">
  <svg class="brand-mark" viewBox="0 0 40 40" width="36" height="36" fill="none">
    <path d="M20 2 L36 8 V20 C36 30 29 36 20 38 C11 36 4 30 4 20 V8 Z" 
          fill="url(#brandGradient)" stroke="var(--brand-green)" stroke-width="1.5"/>
    <path d="M16 26 V14 L26 12 V24" stroke="#ffffff" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="14" cy="27" r="3" fill="#ffffff"/>
    <circle cx="24" cy="25" r="3" fill="#ffffff"/>
    <defs>
      <linearGradient id="brandGradient" x1="0" y1="0" x2="40" y2="40">
        <stop offset="0%" stop-color="#111827"/>
        <stop offset="100%" stop-color="#030712"/>
      </linearGradient>
    </defs>
  </svg>
  <div>
    <h1>Rathkeale College</h1>
    <p>Song & Tradition Portal</p>
  </div>
</div>
      <div class="search-bar-wrapper">
  <input type="text" id="search-input" placeholder="Search hymns and anthems...">
  <div id="suggestions-dropdown" class="suggestions-dropdown hidden"></div>
</div>
    </header>

    <div class="filter-dashboard">
      <div class="filter-group">
        <span class="filter-label">TYPE:</span>
        <button class="btn filter-btn active" id="filter-all-type">All Types</button>
        <button class="btn filter-btn" id="filter-hymn">Hymns</button>
        <button class="btn filter-btn" id="filter-anthem">Anthems</button>
      </div>
      <div class="filter-group">
        <span class="filter-label">LENGTH:</span>
        <button class="btn filter-btn active" id="filter-all-len">Any Length</button>
        <button class="btn filter-btn" id="filter-short">Short (< 3m)</button>
        <button class="btn filter-btn" id="filter-long">Long (3m+)</button>
      </div>
      <div class="filter-group filter-favourites-group" id="favourites-filter-group">
        <!-- Populated by App.js based on login state -->
      </div>
    </div>

    <div class="catalogue-layout-zone">
      <div id="songs-container"></div>
    </div>
    <footer class="app-footer">
      <p>&copy; 2026 Rathkeale College Song Portal. All rights reserved.</p>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
  <script src="/js/types.js"></script>
  <script src="/js/player.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/App.js"></script>
  <script src="/js/auto-logout.js"></script>
  <script src="/js/auth-widget.js"></script>
</body>
</html>
